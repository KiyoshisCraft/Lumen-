<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen – Biblioteca e editor</title>
<style>
:root{--bg:#161616;--pn:#222224;--ink:#e6e3de;--mu:#8d8982;--ln:#35353a;--ac:#e0a63a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:var(--pn);border-bottom:1px solid var(--ln)}
h1{font:600 17px Georgia,serif;margin:0 auto 0 0}
button,.btn,select{font:inherit;color:var(--ink);background:#2c2c30;border:1px solid var(--ln);border-radius:5px;padding:5px 9px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ac)}button.on,button.p{background:var(--ac);color:#1a1405;border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{flex:1;display:flex;min-height:0}.v{display:none;flex:1;min-height:0;min-width:0}.v.on{display:flex}#v3{flex-direction:column}
.tl{flex:1;overflow:auto;padding:4px 14px 20px}
.tl h2{font:600 15px Georgia,serif;margin:18px 0 2px;text-transform:capitalize}.tl h2 small{font:12px system-ui,sans-serif;color:var(--mu);margin-left:8px}
.tl h3{font-size:12px;color:var(--mu);margin:10px 0 4px;font-weight:400}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.t{margin:0;cursor:pointer;position:relative;border:2px solid transparent;border-radius:4px;overflow:hidden;background:#111}.t.on{border-color:var(--ac)}
.t img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}.t span{display:block;font-size:10px;color:var(--mu);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t i{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px #000}
.pe{margin:40px auto;color:var(--mu);text-align:center;max-width:300px}
.tb{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
#st{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-width:0;position:relative}
#cv{max-width:100%;max-height:100%;box-shadow:0 0 0 1px #000}#cv.wb{cursor:crosshair}
#em{position:absolute;color:var(--mu);text-align:center;max-width:280px}
aside{width:310px;background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding:2px 12px 16px}
details{border-bottom:1px solid var(--ln);padding:7px 0}summary{font-weight:600;cursor:pointer;padding:3px 0}
.r{display:grid;grid-template-columns:92px 1fr 36px;gap:6px;align-items:center;margin:5px 0}
.r b{font-weight:400;text-align:right;color:var(--mu);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
#hi{width:100%;height:64px;background:#111;display:block;margin:8px 0;border-radius:3px}
#cc{width:100%;aspect-ratio:1;background:#111;border-radius:3px;touch-action:none;display:block}
.ly{display:flex;gap:6px;align-items:center;padding:3px 4px;border:1px solid var(--ln);border-radius:4px;margin:3px 0;cursor:pointer}.ly.on{border-color:var(--ac);background:#2c2a22}
.ly span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ly button{padding:0 7px}
#bar{display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--pn);border-top:1px solid var(--ln)}#bar button{flex:1}
#tt{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ac);color:#1a1405;padding:7px 12px;border-radius:5px;display:none;z-index:9;max-width:90%}
@media(max-width:780px){#v2{flex-direction:column}aside{width:100%;height:46%;border-left:0;border-top:1px solid var(--ln)}}
</style>
</head>
<body>
<header>
<h1>Lumen</h1>
<label class="btn">Importar do cartão<input id="fi" type="file" accept=".cr2,.nef,.arw,.dng,.orf,.rw2,image/*" multiple hidden></label>
<button id="dr">Drive</button>
</header>
<main>
<section class="v" id="v1"><div class="tl" id="t1"></div></section>
<section class="v" id="v2">
<div id="st"><canvas id="cv"></canvas><div id="em">Escolha uma foto em Brutos para editar.</div></div>
<aside>
<canvas id="hi" width="286" height="64"></canvas>
<details open><summary>Camadas</summary><div id="ly"></div>
<div class="r"><span>Opacidade</span><input id="lo" type="range" min="0" max="100" value="100"><b id="lv">100</b></div>
<div class="row"><button id="la">+ Ajuste</button><button id="ld">Duplicar</button><button id="lu" title="Subir">↑</button><button id="lw" title="Descer">↓</button><button id="lx">Excluir</button></div>
<div class="row"><button id="cp">Copiar ajustes</button><button id="ps">Colar</button><button id="rs">Repor</button></div></details>
<details><summary>Predefinições</summary><div class="row" id="pre"></div></details>
<details open><summary>Básico</summary><div class="row"><button id="wb">Conta-gotas de brancos</button></div><div id="gb"></div></details>
<details><summary>Curva de tons</summary><div class="row" id="ct"></div><canvas id="cc" width="260" height="260"></canvas></details>
<details><summary>Cor (HSL)</summary><div class="row" id="hm"></div><div id="gh"></div></details>
<details><summary>Detalhe</summary><div id="gd"></div></details>
<details><summary>Efeitos</summary><div id="ge"></div></details>
<details><summary>Filtro graduado</summary><div id="gg"></div></details>
<details><summary>Recorte e geometria (camada Fundo)</summary><div id="go"></div>
<div class="row"><select id="ar"><option value="o">Original</option><option value="1">1:1</option><option value="1.25">5:4</option><option value="1.5">3:2</option><option value="1.7778">16:9</option><option value="0.8">4:5</option></select><button id="rt">Rodar 90°</button><button id="fl">Espelhar</button></div></details>
<details open><summary>Exportar</summary>
<div class="row"><select id="xf"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
<select id="xs"><option value="0">Tamanho original</option><option value="4096">4096 px</option><option value="2048">2048 px</option><option value="1080">1080 px</option></select></div>
<div class="r"><span>Qualidade</span><input id="xq" type="range" min="50" max="100" value="92"><b id="xv">92</b></div>
<div class="row"><button class="p" id="ex">Exportar esta</button><button id="ea">Exportar editadas</button><button id="rm">Remover foto</button></div></details>
</aside>
</section>
<section class="v" id="v3">
<div class="tb"><button id="sa">Selecionar tudo</button><button id="dl">Baixar</button><button class="p" id="dv">Enviar ao Drive</button><button id="dd">Pasta do Drive…</button><button id="dx">Excluir</button></div>
<div class="tl" id="t3"></div></section>
</main>
<div id="tt"></div>
<nav id="bar"><button data-v="1">Brutos (<span id="c1">0</span>)</button><button data-v="2">Editor</button><button data-v="3">Finalizados (<span id="c3">0</span>)</button><button id="cmp" hidden>Ver antes</button></nav>
<script>
const $=s=>document.querySelector(s),cl=x=>x<0?0:x>255?255:x;
const SL=[["temp","Temperatura",-100,100,0,1,"b"],["tint","Tonalidade",-100,100,0,1,"b"],["exposure","Exposição",-3,3,0,.01,"b"],["contrast","Contraste",-100,100,0,1,"b"],["highlights","Realces",-100,100,0,1,"b"],["shadows","Sombras",-100,100,0,1,"b"],["whites","Brancos",-100,100,0,1,"b"],["blacks","Pretos",-100,100,0,1,"b"],["texture","Textura",-100,100,0,1,"b"],["clarity","Clareza",-100,100,0,1,"b"],["dehaze","Remover névoa",-100,100,0,1,"b"],["vibrance","Vibração",-100,100,0,1,"b"],["sat","Saturação",-100,100,0,1,"b"],
["sharp","Nitidez",0,100,0,1,"d"],["nr","Redução de ruído",0,100,0,1,"d"],["vig","Vinheta",-100,100,0,1,"e"],["grain","Grão",0,100,0,1,"e"],
["gexp","Exposição",-3,3,0,.01,"g"],["gang","Ângulo",0,360,0,1,"g"],["gpos","Posição",-50,50,0,1,"g"],["ang","Endireitar",-30,30,0,.1,"o"]];
const defS=()=>{const s={ar:"o",flip:0,rot:0};SL.forEach(x=>s[x[0]]=x[4]);return s};
const defC=()=>[0,1,2,3].map(()=>[[0,0],[255,255]]),z8=()=>Array(8).fill(0),defH=()=>({h:z8(),s:z8(),l:z8()});
const lay=n=>({n,S:defS(),C:defC(),H:defH(),op:100,vis:true}),keep=S=>({ar:S.ar,flip:S.flip,rot:S.rot,ang:S.ang});
let ph=[],XS=[],SEL=new Set(),P=null,cur=null,V=1,wbm=false,orig=false,G=null,raf=0,chn=0,hmode="h",stm=0,clip=null;
const T=g=>g=="o"?P.L[0].S:cur.S,cv=$("#cv"),ctx=cv.getContext("2d");
let ttm=0;const tt=m=>{const e=$("#tt");e.textContent=m;e.style.display="block";clearTimeout(ttm);ttm=setTimeout(()=>e.style.display="none",3500)};
// Armazenamento local (IndexedDB)
const DB=new Promise((ok,no)=>{const r=indexedDB.open("lumen",1);r.onupgradeneeded=()=>["p","b","x"].forEach(s=>r.result.createObjectStore(s,{keyPath:"id"}));r.onsuccess=()=>ok(r.result);r.onerror=no});
const dbp=(s,op,v)=>DB.then(d=>new Promise((ok,no)=>{const r=d.transaction(s,"readwrite").objectStore(s)[op](v);r.onsuccess=()=>ok(r.result);r.onerror=no}));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const load=b=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(b)});
const ens=async p=>{if(!p.img){const r=await dbp("b","get",p.id);p.img=await load(r.blob)}};
const sv=()=>{clearTimeout(stm);stm=setTimeout(()=>{if(P){const{img,...m}=P;dbp("p","put",m)}},500)};
// RAW: extrai a prévia JPEG embutida (CR2, NEF, ARW, DNG...) e a data da foto
async function raw(f){const b=await f.arrayBuffer(),v=new DataView(b),le=v.getUint16(0)==0x4949,g=o=>v.getUint16(o,le),g4=o=>v.getUint32(o,le),N=b.byteLength;
 let o=g4(4),c=[],date=0,rot=0;
 for(let n=0;o>0&&o<N-2&&n<8;n++){const k=g(o),t={};for(let i=0;i<k;i++){const e=o+2+i*12;t[g(e)]=[g(e+2),g4(e+4),e+8]}
  const V=id=>t[id]&&(t[id][0]==3&&t[id][1]==1?g(t[id][2]):g4(t[id][2]));
  if(!n){rot={6:1,3:2,8:3}[V(0x112)]||0;if(t[0x132]&&t[0x132][1]>=19){const s=new TextDecoder().decode(new Uint8Array(b,g4(t[0x132][2]),19)).match(/\d+/g);if(s&&s.length>5)date=new Date(s[0],s[1]-1,s[2],s[3],s[4],s[5]).getTime()}}
  [[0x111,0x117],[0x201,0x202]].forEach(([a,l])=>{if(t[a]&&t[l]&&t[a][1]==1)c.push([V(a),V(l)])});
  o=g4(o+2+k*12)}
 c.sort((a,b)=>b[1]-a[1]);
 for(const[s,l]of c)if(s+l<=N&&v.getUint16(s)==0xFFD8)try{const blob=new Blob([b.slice(s,s+l)],{type:"image/jpeg"});await load(blob);return{blob,date,rot}}catch(_){}
 throw 0}
async function add(f,bt){let blob=f,date=f.lastModified,rot=0;
 if(/\.(cr2|nef|arw|dng|orf|rw2)$/i.test(f.name)){const r=await raw(f);blob=r.blob;date=r.date||date;rot=r.rot}
 const im=await load(blob),c=document.createElement("canvas"),s=240/Math.max(im.naturalWidth,im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;
 c.width=rot%2?h:w;c.height=rot%2?w:h;const x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/2);x.drawImage(im,-w/2,-h/2,w,h);
 const p={id:uid(),name:f.name,date,batch:bt,th:c.toDataURL("image/jpeg",.7),L:[lay("Fundo")]};p.L[0].S.rot=rot;
 await dbp("b","put",{id:p.id,blob});await dbp("p","put",p);ph.push(p)}
$("#fi").onchange=async e=>{const F=[...e.target.files],bt=Date.now(),bad=[];e.target.value="";let n=0;
 for(const f of F){tt(`Importando ${++n}/${F.length}…`);try{await add(f,bt)}catch(x){bad.push(f.name)}}
 tt(bad.length?`${bad.length} arquivo(s) não abriram (ex.: ${bad[0]}). CR3 ainda não é suportado.`:`${F.length} fotos importadas`);go(1)};
// Linhas do tempo
const dk=d=>new Date(d-new Date(d).getTimezoneOffset()*6e4).toISOString().slice(0,10);
function tl(el,A,bk,on,fn){el.innerHTML="";
 if(!A.length){el.innerHTML='<p class="pe">'+(bk?"Nenhuma foto ainda. Toque em Importar do cartão e escolha os arquivos CR2.":"Nada exportado ainda. Edite uma foto e toque em Exportar.")+"</p>";return}
 const D={};A.forEach(a=>(D[dk(a.date)]=D[dk(a.date)]||[]).push(a));
 Object.keys(D).sort().reverse().forEach(k=>{const L=D[k].sort((a,b)=>a.date-b.date),h=document.createElement("h2");
  h.innerHTML=new Date(k+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+`<small>${L.length} ${L.length>1?"fotos":"foto"}</small>`;el.appendChild(h);
  const B={};L.forEach(a=>{const b=bk?a.batch:0;(B[b]=B[b]||[]).push(a)});
  Object.keys(B).sort((a,b)=>b-a).forEach(b=>{if(bk){const s=document.createElement("h3");s.textContent="Transferência de "+new Date(+b).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+" · "+B[b].length+" fotos";el.appendChild(s)}
   const g=document.createElement("div");g.className="g";
   B[b].forEach(a=>{const f=document.createElement("figure");f.className="t"+(on(a)?" on":"");f.innerHTML=`<img src="${a.th}" alt=""><span></span>`+(a.ed?"<i></i>":"");f.querySelector("span").textContent=a.name;f.onclick=()=>fn(a,f);g.appendChild(f)});el.appendChild(g)})})}
const rn=()=>{$("#c1").textContent=ph.length;$("#c3").textContent=XS.length;
 if(V==1)tl($("#t1"),ph,1,a=>a==P,a=>openP(a).then(()=>go(2)));
 if(V==3)tl($("#t3"),XS,0,a=>SEL.has(a.id),(a,f)=>{SEL.has(a.id)?SEL.delete(a.id):SEL.add(a.id);f.classList.toggle("on")})};
function go(n){V=n;document.querySelectorAll(".v").forEach(e=>e.classList.toggle("on",e.id=="v"+n));document.querySelectorAll("#bar [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v==n));
 $("#cmp").hidden=n!=2;if(n==2){cv.style.display=P?"":"none";$("#em").style.display=P?"none":"";if(P)draw()}rn()}
document.querySelectorAll("#bar [data-v]").forEach(b=>b.onclick=()=>go(+b.dataset.v));
async function openP(p){await ens(p);P=p;cur=p.L[0];G=null;setO(false);lui();sync();}
// Sliders
const sl={};
SL.forEach(([k,n,a,b,d,st,g])=>{const r=document.createElement("div");r.className="r";r.innerHTML=`<label for="s${k}">${n}</label><input id="s${k}" type="range" min="${a}" max="${b}" step="${st}" value="${d}"><b>${d}</b>`;$("#g"+g).appendChild(r);const i=r.querySelector("input"),v=r.querySelector("b");sl[k]={i,v,g};
 i.oninput=()=>{if(!cur)return;T(g)[k]=+i.value;v.textContent=i.value;q()};i.ondblclick=()=>{if(!cur)return;T(g)[k]=d;i.value=d;v.textContent=d;q()}});
const PR={"Original":{},"Vívido":{contrast:20,vibrance:40,sat:12,highlights:-20,shadows:20,clarity:15},"Cinema":{contrast:25,temp:-15,tint:8,sat:-10,vig:-35,blacks:15},"Dourado":{temp:45,exposure:.15,vibrance:20,highlights:-15,vig:-20},"P&B":{sat:-100,contrast:30,clarity:20,grain:25,vig:-25},"Suave":{contrast:-25,shadows:35,highlights:-25,sat:-10,exposure:.2},"Retrato":{clarity:-15,texture:-20,shadows:15,vibrance:15,sharp:25}};
Object.keys(PR).forEach(n=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>{if(!cur)return;const K=keep(cur.S);Object.assign(cur.S,defS(),PR[n],K);cur.C=defC();cur.H=defH();sync();q()};$("#pre").appendChild(b)});
function sync(){if(!cur)return;SL.forEach(x=>{const s=sl[x[0]],v=T(s.g)[x[0]];s.i.value=v;s.v.textContent=v});$("#ar").value=P.L[0].S.ar;hui();cdraw()}
// Camadas
const li=()=>P.L.indexOf(cur);
function lui(){const g=$("#ly");g.innerHTML="";if(!P)return;
 for(let i=P.L.length-1;i>=0;i--){const l=P.L[i],r=document.createElement("div"),e=document.createElement("button"),s=document.createElement("span");r.className="ly"+(l==cur?" on":"");
  e.textContent=l.vis?"●":"○";e.title="Mostrar/ocultar";e.onclick=ev=>{ev.stopPropagation();l.vis=!l.vis;lui();q()};
  s.textContent=l.n;s.title="Toque duplo para renomear";s.ondblclick=()=>{const n=prompt("Nome da camada",l.n);if(n){l.n=n;lui();sv()}};
  r.onclick=()=>{cur=l;lui();sync()};r.append(e,s);g.appendChild(r)}
 $("#lo").value=cur.op;$("#lv").textContent=cur.op}
$("#lo").oninput=e=>{if(cur){cur.op=+e.target.value;$("#lv").textContent=e.target.value;q()}};
$("#la").onclick=()=>{if(!P)return;const l=lay("Ajuste "+P.L.length);P.L.splice(li()+1,0,l);cur=l;lui();sync();q()};
$("#ld").onclick=()=>{if(!P)return;const l=JSON.parse(JSON.stringify(cur));l.n+=" cópia";P.L.splice(li()+1,0,l);cur=l;lui();sync();q()};
function mv(d){const i=li(),j=i+d;if(!P||i<1||j<1||j>=P.L.length)return;[P.L[i],P.L[j]]=[P.L[j],P.L[i]];lui();q()}
$("#lu").onclick=()=>mv(1);$("#lw").onclick=()=>mv(-1);
$("#lx").onclick=()=>{if(!P)return;const i=li();if(i<1)return tt("A camada Fundo não pode ser excluída.");P.L.splice(i,1);cur=P.L[i-1];lui();sync();q()};
$("#rs").onclick=()=>{if(cur){const K=keep(cur.S);cur.S=Object.assign(defS(),K);cur.C=defC();cur.H=defH();sync();q()}};
$("#cp").onclick=()=>{if(cur)clip=JSON.stringify([cur.S,cur.C,cur.H])};
$("#ps").onclick=()=>{if(cur&&clip){const K=keep(cur.S);[cur.S,cur.C,cur.H]=JSON.parse(clip);Object.assign(cur.S,K);sync();q()}};
// HSL
const HN=["Vermelhos","Laranjas","Amarelos","Verdes","Azuis-claros","Azuis","Roxos","Magentas"],HC=["#e5484d","#f08a24","#e6c229","#46a758","#2cb5c4","#3e7fd9","#8e5bd9","#d94fa8"];
[["h","Matiz"],["s","Saturação"],["l","Luminância"]].forEach(([k,n])=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>{hmode=k;hui()};b.dataset.k=k;$("#hm").appendChild(b)});
function hui(){const g=$("#gh");g.innerHTML="";document.querySelectorAll("#hm button").forEach(b=>b.classList.toggle("on",b.dataset.k==hmode));if(!cur)return;
 HN.forEach((n,i)=>{const r=document.createElement("div");r.className="r";const v=cur.H[hmode][i];r.innerHTML=`<label style="color:${HC[i]}">${n}</label><input type="range" min="-100" max="100" value="${v}"><b>${v}</b>`;const e=r.querySelector("input"),o=r.querySelector("b");
  e.oninput=()=>{cur.H[hmode][i]=+e.value;o.textContent=e.value;q()};e.ondblclick=()=>{cur.H[hmode][i]=0;e.value=0;o.textContent=0;q()};g.appendChild(r)})}
// Curva
["RGB","R","G","B"].forEach((n,i)=>{const b=document.createElement("button");b.textContent=n;b.dataset.i=i;b.onclick=()=>{chn=i;cdraw()};$("#ct").appendChild(b)});
const cc=$("#cc"),cx=cc.getContext("2d");let dr=-1;
function mk(p){const n=p.length,x=p.map(a=>a[0]),y=p.map(a=>a[1]),d=[],m=[];for(let i=0;i<n-1;i++)d[i]=(y[i+1]-y[i])/(x[i+1]-x[i]);m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
